[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexkit"
dynamic = ["version"]
description = "Cross-platform ChromeOS Flex downloader and USB installer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.gui-scripts]
flexkit = "flexkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flexkit = ["assets/**/*"]

[tool.setuptools.dynamic]
version = {attr = "flexkit.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

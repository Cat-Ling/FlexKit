[package]
name = "flexshim"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "UEFI variable compatibility shim for booting ChromeOS Flex on early UEFI firmware"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flexshimx64"
path = "src/main.rs"
test = false

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

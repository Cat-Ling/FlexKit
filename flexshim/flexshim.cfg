# flexshim configuration file (place in the same directory as flexshimx64.efi).
# All options are disabled by default; uncomment a line to enable it.

# Append `cros_debug` to the Linux kernel command line to enable ChromeOS
# developer features (crosh `shell`, VT2 root console via Ctrl+Alt+F2),
# stateful `/mnt/stateful_partition/etc/lsb-release` overrides in update_engine,
# and blocking of periodic background update checks. Interactive update checks
# during OOBE setup and in Settings remain active unless overridden in stateful
# `/mnt/stateful_partition/etc/lsb-release`.
# cros_debug=true

# Space-separated Linux kernel boot options appended to the vboot command line.
# Example: extra_cmdline=i8042.nomux i915.enable_psr=0
# extra_cmdline=

name: Build & Test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  native-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Build and test flexshim (UEFI)
        shell: bash
        run: |
          cargo test --lib --manifest-path flexshim/Cargo.toml
          python scripts/build.py --build-flexshim-only

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compile native binary
        run: python scripts/build.py --skip-flexshim-build

      - name: Smoke test compiled binary
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Linux" ]; then
            dist/*.bin --version
            test -f build/nuitka/*.dist/flexkit/assets/flexshim/flexshimx64.efi
            test -f build/nuitka/*.dist/flexkit/assets/flexshim/flexshim.cfg
          elif [ "${{ runner.os }}" = "Windows" ]; then
            dist/*.exe --version
            test -f build/nuitka/*.dist/flexkit/assets/flexshim/flexshimx64.efi
            test -f build/nuitka/*.dist/flexkit/assets/flexshim/flexshim.cfg
          elif [ "${{ runner.os }}" = "macOS" ]; then
            build/nuitka/*.app/Contents/MacOS/flexkit.bin --version
            test -f build/nuitka/*.app/Contents/MacOS/flexkit/assets/flexshim/flexshimx64.efi
            test -f build/nuitka/*.app/Contents/MacOS/flexkit/assets/flexshim/flexshim.cfg
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*

  freebsd-build:
    name: Build (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Build and test flexshim (UEFI)
        run: |
          cargo test --lib --manifest-path flexshim/Cargo.toml
          python3 scripts/build.py --build-flexshim-only

      - name: Test and build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -eu
            pkg update
            PY_PKG="$(pkg rquery '%n' | grep -E '^py3[0-9]+-pyside6$' | sort -V | tail -n 1 || true)"
            QT_PLUGIN="pyside6"
            if [ -z "$PY_PKG" ]; then
              PY_PKG="$(pkg rquery '%n' | grep -E '^py3[0-9]+-qt6-pyqt$' | sort -V | tail -n 1 || true)"
              QT_PLUGIN="pyqt6"
            fi
            if [ -z "$PY_PKG" ]; then
              echo "No PySide6 or PyQt6 package found in pkg repository" >&2
              exit 1
            fi
            PY_FLAVOR="${PY_PKG%%-*}"
            PY_MINOR="${PY_FLAVOR#py3}"
            PY_VER="3.${PY_MINOR}"
            pkg install -y "python3${PY_MINOR}" "${PY_FLAVOR}-pip" "${PY_FLAVOR}-setuptools" "$PY_PKG" "${PY_FLAVOR}-pytest" "${PY_FLAVOR}-zstandard" patchelf ccache git
            cat > /tmp/flexkit-freebsd-env.sh <<EOF
            export PY_BIN="python${PY_VER}"
            export QT_PLUGIN="${QT_PLUGIN}"
            EOF
          run: |
            set -eu
            . /tmp/flexkit-freebsd-env.sh
            if "$PY_BIN" -m venv --system-site-packages /tmp/nuitka-venv 2>/dev/null; then
              /tmp/nuitka-venv/bin/python -m pip install --upgrade "nuitka>=2.5"
              PY_RUN=/tmp/nuitka-venv/bin/python
            else
              rm -rf /tmp/nuitka-venv
              PIP_BREAK_SYSTEM_PACKAGES=1 "$PY_BIN" -m pip install "nuitka>=2.5"
              PY_RUN="$PY_BIN"
            fi
            QT_QPA_PLATFORM=offscreen PYTHONPATH=src "$PY_RUN" -m pytest -q
            "$PY_RUN" scripts/build.py --qt-plugin="$QT_PLUGIN" --skip-flexshim-build
            build/nuitka/*.dist/flexkit.bin --version
            test -f build/nuitka/*.dist/flexkit/assets/flexshim/flexshimx64.efi
            test -f build/nuitka/*.dist/flexkit/assets/flexshim/flexshim.cfg

      - uses: actions/upload-artifact@v5
        with:
          name: dist-freebsd
          path: |
            dist/*

  release:
    name: Publish Release
    needs: [native-build, freebsd-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
